import com.hypherionmc.modpublisher.properties.ModLoader

plugins {
    id 'com.gradleup.shadow'
	id "com.hypherionmc.modutils.modpublisher" version "2.1.8"
}

def platform = project.name;

// Function to read the last section from CHANGELOG.md
def changelog_last_section() {
	def changelogFile = rootProject.file('CHANGELOG.md')
	if (!changelogFile.exists()) {
		return "No changelog available"
	}

	def content = changelogFile.text
	def sections = content.split(/(?m)(?=^# )/)

	// Return the first section (most recent) after the split
	// Remove the first empty element if it exists
	def recentSection = sections.find { it.trim().startsWith('#') }
	return recentSection ?: "No changelog available"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

fabricApi {
	configureDataGeneration() {
		client = true
		modId = "druids"
		outputDirectory = project(':common').file('src/main/generated')
	}
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}

	maven {
		name "KosmX's maven"
		url 'https://maven.kosmx.dev/'
	}

	maven {
		url = 'https://maven.shedaniel.me/'
	}

	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/"
	}
	maven {
		name = "Ladysnake Libs"
		url = 'https://maven.ladysnake.org/releases'
	}

	repositories {
		maven { url "https://jitpack.io" }
	}

	maven {
		url "https://cursemaven.com"
		content { includeGroup "curse.maven" }
	}

	maven {
		name = "Jared's maven"
		url = "https://maven.blamejared.com/"
	}
	maven {
		name = "ModMaven"
		url = "https://modmaven.dev"
	}

	maven {
		name = "AzureDoom Mods"
		url = "https://maven.azuredoom.com/mods"
	}

	maven {
		url = uri("https://maven.puffish.net")
	}
}


dependencies {
	modImplementation("net.fabricmc:fabric-loader:${fabric}")
	modImplementation("net.fabricmc.fabric-api:fabric-api:${fapi}")

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

	modImplementation("dev.kosmx.player-anim:player-animation-lib-${platform}:${playeranim}")
	modImplementation("me.shedaniel.cloth:cloth-config-${platform}:${cloth}")
	modImplementation("maven.modrinth:armor-model-api:${armormodel}-${platform}")
	modImplementation("maven.modrinth:tiny-config:${ticonfig}-${platform}")
	modImplementation("maven.modrinth:runes:${rune}-${platform}")
	modImplementation("maven.modrinth:spell-power:${spellpow}-${platform}")
	modImplementation("maven.modrinth:spell-engine:${spell}-${platform}")
	modImplementation("maven.modrinth:more-rpg-library:${mrpg}-${platform}")
	modImplementation("maven.modrinth:skill-tree:${skilltree}-${platform}")
	modImplementation("maven.modrinth:ranged-weapon-api:${rangedapi}-${platform}")
	modImplementation("maven.modrinth:trinkets:${trinkets}")
	modImplementation("org.ladysnake.cardinal-components-api:cardinal-components-base:6.1.3")
	modImplementation("org.ladysnake.cardinal-components-api:cardinal-components-entity:6.1.3")

	modImplementation("net.puffish:skillsmod:${puffskills}:${platform}")

	modImplementation("maven.modrinth:jei:${jei}")
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

publisher {
	// Setup the required API keys.
	apiKeys {
		// Modrinth Token
		modrinth System.getenv("MODRINTH_TOKEN")
		// Curseforge Token
		curseforge System.getenv("CURSEFORGE_TOKEN")
	}

	setDebug(false)

	setCurseID("1351037")
	setModrinthID("druids")

	setVersionType(release_type)

	setChangelog(changelog_last_section())

	// Required for Modrinth/GitHub
	setVersion("${mod_version}+${platform}-${minecraft_version}")

	setDisplayName("Druids v${mod_version} ${platform}")

	setGameVersions(minecraft_version)

	setLoaders(ModLoader.FABRIC)

	setArtifact(remapJar)

	// Modrinth Dependencies
	modrinthDepends {
		// Multiple required dependencies
		required 'fabric-api', 'spell-engine', 'armor-model-api', 'more-rpg-library', 'skill-tree'
	}

	// Curse Dependencies
	curseDepends {
		// Multiple required dependencies
		required 'fabric-api', 'spell-engine', 'armor-model-api', 'more-rpg-library', 'skill-tree'
	}
}

