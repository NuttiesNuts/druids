plugins {
    id 'com.gradleup.shadow'
    id "me.modmuss50.mod-publish-plugin" version "2.1.1"
}

def platform = project.name

loom {
    forge {
        mixinConfig "druids.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

def generatedResources = project(':common').file('src/main/generated')
sourceSets {
    main {
        resources.srcDir generatedResources
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }

    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven { url 'https://maven.kosmx.dev/' }
    maven { url 'https://maven.shedaniel.me/' }
    maven { url 'https://maven.fabricmc.net' }
    maven { url 'https://maven.theillusivec4.top/' }
    maven { url "https://jitpack.io" }
    maven { url 'https://maven.su5ed.dev/releases' }


    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }

    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }

    maven {
        name "KosmX's maven"
        url 'https://maven.kosmx.dev/'
    }

    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }

    maven {
        name = "Ladysnake Libs"
        url = 'https://maven.ladysnake.org/releases'
    }

    maven {
        url "https://cursemaven.com"
        content { includeGroup "curse.maven" }
    }

    maven {
        url = uri("https://maven.puffish.net")
    }

}

dependencies {
    forge "net.minecraftforge:forge:$forge_version"
    modImplementation "dev.architectury:architectury-forge:$architectury_api_version"
    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    modImplementation("dev.kosmx.player-anim:player-animation-lib-forge:${player_anim_version}")
    modImplementation("me.shedaniel.cloth:cloth-config-${platform}:${cloth_config_version}")

    modImplementation("maven.modrinth:armor-model-api:${armor_model_api_version}-${platform}")
    modImplementation("maven.modrinth:tiny-config:${tiny_config_version}-${platform}")
    modImplementation("maven.modrinth:spell-power:${spell_power_version}-${platform}")
    modImplementation("maven.modrinth:spell-engine:${spell_engine_version}-${platform}")
    modImplementation("maven.modrinth:more-rpg-library:${mrpg_version}-${platform}")
    modImplementation("maven.modrinth:skill-tree:${skilltree_version}-${platform}")
    modImplementation("maven.modrinth:ranged-weapon-api:${ranged_api_version}-${platform}")

    modImplementation("top.theillusivec4.curios:curios-forge:${curios_version}")
    localRuntime("io.github.llamalad7:mixinextras-forge:${mixin_extras_version}")

    modLocalRuntime("maven.modrinth:runes:${runes_version}-${platform}")
    modImplementation("net.puffish:skillsmod:${pufferfish_skills_version}:${platform}")
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: inputs.properties.version.toString().split('\\+')[0]
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
