//file:noinspection GroovyAssignabilityCheck
//file:noinspection GroovyAccessibility
plugins {
	id "maven-publish"
	alias libs.plugins.loom
	alias libs.plugins.minotaur
	id("net.darkhax.curseforgegradle") version "1.1.26"
}

version = "$modVersion+$branchName"
archivesBaseName = project.slug

repositories {
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}

	maven {
		name "KosmX's maven"
		url 'https://maven.kosmx.dev/'
	}

	maven {
		url = 'https://maven.shedaniel.me/'
	}

	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/"
	}
	maven {
		name = "Ladysnake Libs"
		url = 'https://maven.ladysnake.org/releases'
	}

	repositories {
		maven { url "https://jitpack.io" }
	}

	maven {
		url "https://cursemaven.com"
		content { includeGroup "curse.maven" }
	}

	maven {
		name = "Jared's maven"
		url = "https://maven.blamejared.com/"
	}
	maven {
		name = "ModMaven"
		url = "https://modmaven.dev"
	}

	maven {
		name = "AzureDoom Mods"
		url = "https://maven.azuredoom.com/mods"
	}

}

dependencies {
	minecraft libs.mc
	mappings variantOf(libs.yarn) { classifier "v2" }

	modImplementation libs.fl
	modImplementation libs.fapi

	include(implementation("com.github.LlamaLad7:MixinExtras:0.1.1"))
	annotationProcessor("com.github.LlamaLad7:MixinExtras:0.1.1")

	modImplementation libs.spell
	modImplementation libs.spellpow
	modImplementation libs.rpg
	modImplementation libs.azure
	modImplementation libs.rune
	modImplementation libs.cloth
	modImplementation libs.playeranim
	modImplementation libs.trink
	modImplementation libs.tiny

	modCompileOnlyApi libs.jeiapi
	modRuntimeOnly libs.jei
}

processResources {
	final Map<String, String> meta = [
		version       : version,
		modId         : modId,
		modName       : modName,
		modDescription: modDescription,
		homepage      : "https://modrinth.com/mod/${slug}",
		issues        : "https://github.com/${user}/${slug}/issues",
		sources       : "https://github.com/${user}/${slug}",
		license       : license,
		authors       : authors.split(", ").join("\",\n    \""),
		contributors  : contributors.split(", ").join("\",\n    \""),
		members       : "${authors}${contributors ? ". Contributions by ${contributors}." : ""}",
		mc            : compatibleVersions.split(", ")[0],
		fl            : libs.versions.fl.get(),
		fapi          : libs.versions.fapi.get(),
		spell         : libs.versions.spell.get(),
		rune		  : libs.versions.rune.get(),
		rpg		  	  : libs.versions.rpg.get(),
	]
	inputs.properties meta
	filesMatching("*.mod.json") { expand(meta) }
	filesMatching("META-INF/*mods.toml") { expand(meta) }
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}


publishing {
	repositories {
	}
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
}

modrinth {
	token = "$System.env.MODRINTH_TOKEN"
	projectId = slug
	versionNumber = project.version
	uploadFile = remapJar
	gameVersions = compatibleVersions.split(", ").toList()
	loaders = compatibleLoaders.split(", ").toList()
	changelog = "$System.env.CHANGELOG"
	syncBodyFrom = "<!--DO NOT EDIT MANUALLY: synced from gh readme-->\n" + rootProject.file("README.md").text
	dependencies {
		required.project 'fabric-api'
		required.project 'spell-engine'
		required.project 'more-rpg-library'
		required.project 'runes'

	}
}

task publishCurseForge(type: net.darkhax.curseforgegradle.TaskPublishCurseForge) {

	apiToken = "$System.env.CURSEFORGE_API_KEY"

	// The main file to upload
	def mainFile = upload(1351037, remapJar)
	mainFile.releaseType = release_type
	mainFile.changelog = "$System.env.CHANGELOG"
	mainFile.changelogType = 'markdown'
	mainFile.gameVersions = compatibleVersions.split(", ").toList()
	mainFile.addModLoader(compatibleLoaders.capitalize())
}

fabricApi {
	configureDataGeneration() {
		client = true
		modId = project.modId
	}
}
