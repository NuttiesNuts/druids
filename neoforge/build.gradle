import com.hypherionmc.modpublisher.properties.ModLoader

plugins {
    id 'com.gradleup.shadow'
	id "com.hypherionmc.modutils.modpublisher" version "2.1.8"
}

def platform = project.name;

// Function to read the last section from CHANGELOG.md
def changelog_last_section() {
	def changelogFile = rootProject.file('CHANGELOG.md')
	if (!changelogFile.exists()) {
		return "No changelog available"
	}

	def content = changelogFile.text
	def sections = content.split(/(?m)(?=^# )/)

	// Return the first section (most recent) after the split
	// Remove the first empty element if it exists
	def recentSection = sections.find { it.trim().startsWith('#') }
	return recentSection ?: "No changelog available"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

def generatedResources = project(':common').file('src/main/generated')
sourceSets {
	main {
		resources.srcDir generatedResources
	}
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }

	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}

	maven {
		name "KosmX's maven"
		url 'https://maven.kosmx.dev/'
	}

	maven {
		url = 'https://maven.shedaniel.me/'
	}

	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/"
	}
	maven {
		name = "Ladysnake Libs"
		url = 'https://maven.ladysnake.org/releases'
	}

	repositories {
		maven { url "https://jitpack.io" }
	}

	maven {
		url "https://cursemaven.com"
		content { includeGroup "curse.maven" }
	}

	maven {
		name = "Jared's maven"
		url = "https://maven.blamejared.com/"
	}
	maven {
		name = "ModMaven"
		url = "https://modmaven.dev"
	}

	maven { url 'https://maven.su5ed.dev/releases' }
	maven { url 'https://maven.fabricmc.net' }

	maven {
		url = uri("https://maven.puffish.net")
	}

	// For Curios (transitive from SpellEngine on NeoForge)
	maven { url 'https://maven.theillusivec4.top/' }
}

dependencies {
	neoForge("net.neoforged:neoforge:${neo}")
	common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
	modImplementation ("org.sinytra.forgified-fabric-api:forgified-fabric-api:${forgefapi}")

	modImplementation("dev.kosmx.player-anim:player-animation-lib-forge:${playeranim}")
	modImplementation("me.shedaniel.cloth:cloth-config-${platform}:${cloth}")
	modImplementation("maven.modrinth:armor-model-api:${armormodel}-${platform}")
	modImplementation("maven.modrinth:tiny-config:${ticonfig}-${platform}")
	modImplementation("maven.modrinth:runes:${rune}-${platform}")
	modImplementation("maven.modrinth:spell-power:${spellpow}-${platform}")
	modImplementation("maven.modrinth:spell-engine:${spell}-${platform}")
	modImplementation("maven.modrinth:more-rpg-library:${mrpg}-${platform}")
	modImplementation("maven.modrinth:skill-tree:${skilltree}-${platform}")
	modImplementation("maven.modrinth:ranged-weapon-api:${rangedapi}-${platform}")
	modImplementation("top.theillusivec4.curios:curios-${platform}:${curios}")

	modImplementation("net.puffish:skillsmod:${puffskills}:${platform}")
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

publisher {
	// Setup the required API keys.
	apiKeys {
		// Modrinth Token
		modrinth System.getenv("MODRINTH_TOKEN")
		// Curseforge Token
		curseforge System.getenv("CURSEFORGE_TOKEN")
	}

	setDebug(false)

	setCurseID("1351037")
	setModrinthID("druids")

	setVersionType(release_type)

	setChangelog(changelog_last_section())

	// Required for Modrinth/GitHub
	setVersion("${mod_version}+${platform}-${minecraft_version}")

	setDisplayName("Druids v${mod_version} ${platform}")

	setGameVersions(minecraft_version)

	setLoaders(ModLoader.NEOFORGE)

	setArtifact(remapJar)

	// Modrinth Dependencies
	modrinthDepends {
		// Multiple required dependencies
		required 'forgified-fabric-api', 'spell-engine', 'armor-model-api', 'more-rpg-library', 'skill-tree'
	}

	// Curse Dependencies
	curseDepends {
		// Multiple required dependencies
		required 'forgified-fabric-api', 'spell-engine', 'armor-model-api', 'more-rpg-library', 'skill-tree'
	}
}
