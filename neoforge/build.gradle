import com.hypherionmc.modpublisher.properties.ModLoader

plugins {
    id 'com.gradleup.shadow'
	id "com.hypherionmc.modutils.modpublisher" version "2.1.8"
}

def platform = project.name;

// Function to read the last section from CHANGELOG.md
def changelog_last_section() {
	def changelogFile = rootProject.file('CHANGELOG.md')
	if (!changelogFile.exists()) {
		return "No changelog available"
	}

	def content = changelogFile.text
	def sections = content.split(/(?m)(?=^# )/)

	// Return the first section (most recent) after the split
	// Remove the first empty element if it exists
	def recentSection = sections.find { it.trim().startsWith('#') }
	return recentSection ?: "No changelog available"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

def generatedResources = project(':common').file('src/main/generated')
sourceSets {
	main {
		resources.srcDir generatedResources
	}
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }

	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}

	maven {
		name "KosmX's maven"
		url 'https://maven.kosmx.dev/'
	}

	maven {
		url = 'https://maven.shedaniel.me/'
	}

	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/"
	}
	maven {
		name = "Ladysnake Libs"
		url = 'https://maven.ladysnake.org/releases'
	}

	repositories {
		maven { url "https://jitpack.io" }
	}

	maven {
		url "https://cursemaven.com"
		content { includeGroup "curse.maven" }
	}

	maven {
		name = "Jared's maven"
		url = "https://maven.blamejared.com/"
	}
	maven {
		name = "ModMaven"
		url = "https://modmaven.dev"
	}

	maven {
		name = "AzureDoom Mods"
		url = "https://maven.azuredoom.com/mods"
	}

	// For Accessories
	maven { url 'https://maven.wispforest.io/releases' }
	maven { url 'https://maven.su5ed.dev/releases' }
	maven { url 'https://maven.fabricmc.net' }

}

dependencies {
    neoForge libs.neo
    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
	modImplementation ("org.sinytra.forgified-fabric-api:forgified-fabric-api:"+libs.versions.fofapi.get())

	modImplementation("dev.kosmx.player-anim:player-animation-lib-forge:"+libs.versions.playeranim.get())
	modImplementation("me.shedaniel.cloth:cloth-config-${platform}:"+libs.versions.cloth.get())
	modImplementation("mod.azure.azurelibarmor:azurelibarmor-neo-${project.minecraft_version}:"+libs.versions.azure.get())
	modImplementation("maven.modrinth:tiny-config:"+libs.versions.tinyneo.get())

	// Accessories - https://docs.wispforest.io/accessories/developer/dev_setup
	modImplementation ("maven.modrinth:owo-lib:"+libs.versions.owoneo.get()) // AccessoryItem wouldn't compile without this
	modImplementation("io.wispforest:accessories-neoforge:"+libs.versions.accessories.get())
	forgeRuntimeLibrary("blue.endless:jankson:1.2.2")
	forgeRuntimeLibrary("io.wispforest:endec:0.1.5.1")
	forgeRuntimeLibrary("io.wispforest.endec:gson:0.1.3.1")
	forgeRuntimeLibrary("io.wispforest.endec:jankson:0.1.3.1")
	forgeRuntimeLibrary("io.wispforest.endec:netty:0.1.2")

	modImplementation("maven.modrinth:runes:"+libs.versions.runeneo.get())
	modImplementation("maven.modrinth:spell-power:"+libs.versions.spellpowneo.get())
	modImplementation("maven.modrinth:spell-engine:"+libs.versions.spellneo.get())
	modImplementation("maven.modrinth:more-rpg-library:"+libs.versions.rpgneo.get())
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

publisher {
	// Setup the required API keys.
	apiKeys {
		// Modrinth Token
		modrinth System.getenv("MODRINTH_TOKEN")
		// Curseforge Token
		curseforge System.getenv("CURSEFORGE_TOKEN")
	}

	setDebug(false)

	setCurseID("1351037")
	setModrinthID("druids")

	setVersionType(release_type)

	setChangelog(changelog_last_section())

	// Required for Modrinth/GitHub
	setVersion("${mod_version}+${platform}-${minecraft_version}")

	setDisplayName("Druids v${mod_version} ${platform}")

	setGameVersions(minecraft_version)

	setLoaders(ModLoader.NEOFORGE)

	setArtifact(remapJar)

	// Modrinth Dependencies
	modrinthDepends {
		// Multiple required dependencies
		required 'forgified-fabric-api', 'spell-engine', 'azurelib-armor', 'more-rpg-library'
	}

	// Curse Dependencies
	curseDepends {
		// Multiple required dependencies
		required 'forgified-fabric-api', 'spell-engine', 'azurelib-armor', 'more-rpg-library'
	}
}
